[project]
name = "chess-coach"
version = "0.1.0"
description = "Personal chess coaching toolkit: Stockfish analysis, game import and review, driven by Claude Code"
requires-python = ">=3.11"
dependencies = ["chess>=1.11"]

[project.scripts]
coach = "coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
